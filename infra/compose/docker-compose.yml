# ==============================================================================
# Nexora Digital Marketing Platform - Local Development Infrastructure
# STATUS: UNVERIFIED (Docker host par test nahi hua - host par Docker missing hai).
# Pehle jab Docker environment mile tab verify karna hai.
# Local development runs via local SQL Server / LocalDB + standalone mailpit.exe.
# NOTE: SQL Server container requires ACCEPT_EULA=Y and minimum 2GB RAM allocation.
# ==============================================================================

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU17-ubuntu-22.04
    container_name: nexora-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-YourStrong@Pass123}
    ports:
      - "${SQLSERVER_PORT:-1433}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD:-YourStrong@Pass123}\" -C -Q \"SELECT 1\""]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.33.1
    container_name: nexora-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025" # SMTP server
      - "${MAILPIT_UI_PORT:-8025}:8025"   # Web UI
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8025/api/v1/info"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  sqlserver_data:
    driver: local
