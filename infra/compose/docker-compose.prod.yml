services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU17-ubuntu-22.04
    container_name: nexora-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD is required}
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\""]
      interval: 10s
      timeout: 5s
      retries: 5

  nexora-api:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    container_name: nexora-api
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=NexoraProdDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;"
      Cors__AllowedOrigins__0: ${PUBLIC_WEBSITE_URL:-http://localhost:3000}
      Cors__AllowedOrigins__1: ${ADMIN_URL:-http://localhost:5173}
      Email__Provider: ${EMAIL_PROVIDER:-Resend}
      Resend__ApiKey: ${RESEND_API_KEY:-}
      Resend__FromEmail: ${RESEND_FROM_EMAIL:-noreply@nexora.io}
    ports:
      - "${API_PORT:-5201}:8080"
    volumes:
      - api_uploads:/app/wwwroot/uploads

  nexora-website:
    build:
      context: ../..
      dockerfile: apps/website/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:5201}
        INTERNAL_API_URL: http://nexora-api:8080
    container_name: nexora-website
    restart: unless-stopped
    depends_on:
      - nexora-api
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:5201}
      INTERNAL_API_URL: http://nexora-api:8080
    ports:
      - "${WEBSITE_PORT:-3000}:3000"

  nexora-admin:
    build:
      context: ../..
      dockerfile: apps/admin/Dockerfile
      args:
        VITE_API_URL: ${PUBLIC_API_URL:-http://localhost:5201}
    container_name: nexora-admin
    restart: unless-stopped
    depends_on:
      - nexora-api
    ports:
      - "${ADMIN_PORT:-5173}:80"

volumes:
  sqlserver_data:
  api_uploads:
